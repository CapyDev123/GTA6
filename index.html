<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metrópole 3D — Cidade Aberta</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0b1220; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
  canvas { display:block; touch-action:none; cursor: grab; }
  canvas:active { cursor: grabbing; }

  #hud {
    position:fixed; top:16px; left:16px; z-index:10;
    color:#eaf0f6; background:rgba(10,14,22,0.55); backdrop-filter: blur(6px);
    border:1px solid rgba(255,255,255,0.08); border-radius:10px;
    padding:12px 16px; max-width:300px; font-size:13px; line-height:1.55;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
    transition:opacity .5s ease;
  }
  #hud h1 { font-size:15px; font-weight:600; margin-bottom:6px; color:#ffd166; letter-spacing:.2px; }
  #hud .row { display:flex; justify-content:space-between; gap:10px; opacity:.9; }
  #hud kbd {
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
    border-radius:4px; padding:1px 6px; font-size:11px; font-family:monospace;
  }
  #hud .hide-btn { display:block; margin-top:8px; font-size:11px; color:#9db4cc; cursor:pointer; text-decoration:underline; }

  #status {
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:10;
    color:#eaf0f6; background:rgba(10,14,22,0.55); backdrop-filter: blur(6px);
    border:1px solid rgba(255,255,255,0.08); border-radius:10px;
    padding:8px 20px; font-size:13px; display:flex; gap:18px; align-items:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  #status .speed { font-variant-numeric: tabular-nums; font-weight:600; color:#7fd6ff; }
  #status .mode { color:#ffd166; font-weight:600; }

  #prompt {
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%); z-index:10;
    color:#0b1220; background:#ffd166; border-radius:8px; padding:6px 14px;
    font-size:13px; font-weight:600; display:none; box-shadow:0 6px 18px rgba(0,0,0,0.4);
  }

  #crosshairFade {
    position:fixed; inset:0; background:#0b1220; z-index:100;
    display:flex; align-items:center; justify-content:center; color:#eaf0f6;
    font-size:16px; letter-spacing:.5px; transition:opacity .6s ease;
  }
</style>
</head>
<body>

<div id="crosshairFade"><div>Carregando a cidade…</div></div>

<div id="hud">
  <h1>Metrópole 3D</h1>
  <div class="row"><span>Andar</span><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span></div>
  <div class="row"><span>Correr</span><span><kbd>Shift</kbd></span></div>
  <div class="row"><span>Pular</span><span><kbd>Espaço</kbd></span></div>
  <div class="row"><span>Entrar/Sair do carro</span><span><kbd>E</kbd></span></div>
  <div class="row"><span>Olhar em volta</span><span>arraste o mouse</span></div>
  <div class="row"><span>Zoom</span><span>roda do mouse</span></div>
  <span class="hide-btn" id="hideHud">ocultar</span>
</div>

<div id="status">
  <span class="mode" id="modeLabel">A pé</span>
  <span id="speedWrap"><span class="speed" id="speedVal">0</span> km/h</span>
</div>

<div id="prompt">Pressione E para entrar no carro</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r150/three.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- BASIC SETUP ----------
  const scene = new THREE.Scene();
  const skyColor = new THREE.Color(0x8fb6d9);
  scene.background = skyColor;
  scene.fog = new THREE.Fog(skyColor.getHex(), 60, 240);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 500);

  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- LIGHTING ----------
  const hemi = new THREE.HemisphereLight(0xbfd6ff, 0x37342c, 0.65);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xfff2d6, 1.15);
  sun.position.set(80, 120, 40);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -160;
  sun.shadow.camera.right = 160;
  sun.shadow.camera.top = 160;
  sun.shadow.camera.bottom = -160;
  sun.shadow.camera.near = 10;
  sun.shadow.camera.far = 300;
  sun.shadow.bias = -0.0015;
  scene.add(sun);
  scene.add(sun.target);

  // ---------- PROCEDURAL TEXTURES ----------
  function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }

  function asphaltTexture(){
    const c = makeCanvas(256,256), ctx = c.getContext('2d');
    ctx.fillStyle = '#3a3d42'; ctx.fillRect(0,0,256,256);
    for(let i=0;i<3500;i++){
      const x=Math.random()*256, y=Math.random()*256, v=Math.random()*40-20;
      ctx.fillStyle = `rgba(${v>0?255:0},${v>0?255:0},${v>0?255:0},${Math.abs(v)/180})`;
      ctx.fillRect(x,y,1.4,1.4);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  function concreteTexture(){
    const c = makeCanvas(128,128), ctx = c.getContext('2d');
    ctx.fillStyle = '#b9b6ad'; ctx.fillRect(0,0,128,128);
    for(let i=0;i<1200;i++){
      const x=Math.random()*128, y=Math.random()*128, v=Math.random()*30-15;
      ctx.fillStyle = `rgba(${120+v},${118+v},${110+v},0.5)`;
      ctx.fillRect(x,y,1,1);
    }
    ctx.strokeStyle = 'rgba(90,88,82,0.5)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(0,0,128,128);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  function windowTexture(hue){
    const c = makeCanvas(128,256), ctx = c.getContext('2d');
    ctx.fillStyle = hue; ctx.fillRect(0,0,128,256);
    const cols=6, rows=10;
    for(let r=0;r<rows;r++){
      for(let cIdx=0;cIdx<cols;cIdx++){
        const lit = Math.random()>0.55;
        ctx.fillStyle = lit ? 'rgba(255,226,150,0.95)' : 'rgba(25,32,42,0.9)';
        const wpad = 128/cols, hpad = 256/rows;
        ctx.fillRect(cIdx*wpad+3, r*hpad+4, wpad-6, hpad-8);
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  function roadLineTexture(){
    const c = makeCanvas(64,64), ctx = c.getContext('2d');
    ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillRect(0,0,64,64);
    ctx.fillStyle = '#e8c94a';
    ctx.fillRect(24,4,16,28);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.transparent = true;
    return tex;
  }

  const asphaltTex = asphaltTexture();
  const concreteTex = concreteTexture();
  const roadLineTex = roadLineTexture();

  // ---------- GROUND ----------
  const CITY_HALF = 150;
  const groundGeo = new THREE.PlaneGeometry(CITY_HALF*2+40, CITY_HALF*2+40);
  const groundTexClone = asphaltTex.clone(); groundTexClone.needsUpdate = true;
  groundTexClone.repeat.set(60,60);
  const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ map: groundTexClone, roughness:0.95 }));
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  // ---------- CITY GRID ----------
  const buildings = []; // {minX,maxX,minZ,maxZ}
  const blockSpacing = 44;
  const blocksPerSide = 7;
  const half = Math.floor(blocksPerSide/2);
  const buildingColors = [0xb9c4cc, 0xc9b79c, 0xa9b6a1, 0xb3a6b0, 0xc2c2b8, 0x9fb0bd];
  const windowTextures = [windowTexture('#2a2f3a'), windowTexture('#33291f'), windowTexture('#22303a')];

  const buildingGroup = new THREE.Group();
  scene.add(buildingGroup);

  for(let gx=-half; gx<=half; gx++){
    for(let gz=-half; gz<=half; gz++){
      // leave a clear plaza near spawn (center 2x2 area)
      if(Math.abs(gx) <= 1 && Math.abs(gz) <= 1) continue;

      const cx = gx*blockSpacing, cz = gz*blockSpacing;
      const footprint = 20 + Math.random()*6;
      const height = 10 + Math.random()*46;

      // sidewalk
      const sw = new THREE.Mesh(
        new THREE.BoxGeometry(footprint+7, 0.12, footprint+7),
        new THREE.MeshStandardMaterial({ map: concreteTex, roughness:1 })
      );
      sw.position.set(cx, 0.06, cz);
      sw.receiveShadow = true;
      scene.add(sw);

      // building
      const wTex = windowTextures[Math.floor(Math.random()*windowTextures.length)].clone();
      wTex.needsUpdate = true;
      wTex.repeat.set(Math.max(1,Math.round(footprint/6)), Math.max(1,Math.round(height/6)));
      const sideMat = new THREE.MeshStandardMaterial({ map: wTex, roughness:0.75, metalness:0.05 });
      const topMat = new THREE.MeshStandardMaterial({ color: buildingColors[Math.floor(Math.random()*buildingColors.length)], roughness:0.9 });
      const mats = [sideMat, sideMat, topMat, topMat, sideMat, sideMat];

      const b = new THREE.Mesh(new THREE.BoxGeometry(footprint, height, footprint), mats);
      b.position.set(cx, height/2 + 0.12, cz);
      b.castShadow = true; b.receiveShadow = true;
      buildingGroup.add(b);

      buildings.push({
        minX: cx - footprint/2, maxX: cx + footprint/2,
        minZ: cz - footprint/2, maxZ: cz + footprint/2
      });
    }
  }

  // road center-line markings along main streets
  for(let gx=-half; gx<=half; gx++){
    const tex = roadLineTex.clone(); tex.needsUpdate = true;
    tex.repeat.set(1, blocksPerSide*blockSpacing/6);
    const strip = new THREE.Mesh(
      new THREE.PlaneGeometry(1, blocksPerSide*blockSpacing),
      new THREE.MeshBasicMaterial({ map: tex, transparent:true })
    );
    strip.rotation.x = -Math.PI/2;
    strip.position.set(gx*blockSpacing, 0.02, 0);
    scene.add(strip);
  }
  for(let gz=-half; gz<=half; gz++){
    const tex = roadLineTex.clone(); tex.needsUpdate = true;
    tex.repeat.set(1, blocksPerSide*blockSpacing/6);
    const strip = new THREE.Mesh(
      new THREE.PlaneGeometry(1, blocksPerSide*blockSpacing),
      new THREE.MeshBasicMaterial({ map: tex, transparent:true })
    );
    strip.rotation.x = -Math.PI/2;
    strip.rotation.z = Math.PI/2;
    strip.position.set(0, 0.02, gz*blockSpacing);
    scene.add(strip);
  }

  // ---------- TREES & STREETLIGHTS (decor) ----------
  function makeTree(x,z){
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.32,2.2,8), new THREE.MeshStandardMaterial({color:0x6b4a30, roughness:1}));
    trunk.position.y = 1.1; trunk.castShadow = true;
    const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.8,3.4,8), new THREE.MeshStandardMaterial({color:0x3f6b3a, roughness:0.9}));
    leaves.position.y = 3.2; leaves.castShadow = true;
    g.add(trunk, leaves);
    g.position.set(x,0,z);
    scene.add(g);
  }
  function makeStreetlight(x,z){
    const g = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,6,8), new THREE.MeshStandardMaterial({color:0x2b2f33, roughness:0.6, metalness:0.4}));
    pole.position.y = 3; pole.castShadow = true;
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.35,10,10), new THREE.MeshStandardMaterial({color:0xfff2c0, emissive:0xffdd88, emissiveIntensity:0.9}));
    lamp.position.y = 6.1;
    g.add(pole, lamp);
    g.position.set(x,0,z);
    scene.add(g);
  }
  for(let i=0;i<40;i++){
    const gx = (Math.random()*blocksPerSide - half - 0.5) * blockSpacing;
    const gz = (Math.random()*blocksPerSide - half - 0.5) * blockSpacing;
    if(Math.abs(gx) < 24 && Math.abs(gz) < 24) continue;
    if(Math.random() > 0.55) makeTree(gx + (Math.random()*6-3), gz + (Math.random()*6-3));
    else makeStreetlight(gx, gz);
  }

  // ---------- SIMPLE VEHICLE MESH ----------
  function buildCarMesh(color){
    const g = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color, roughness:0.35, metalness:0.55 });
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x1c2733, roughness:0.1, metalness:0.2 });
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111214, roughness:0.9 });

    const base = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.6, 4.2), bodyMat);
    base.position.y = 0.55; base.castShadow = true; base.receiveShadow = true;
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.55, 2.2), glassMat);
    cabin.position.set(0, 1.05, -0.2); cabin.castShadow = true;
    g.add(base, cabin);

    const wheelGeo = new THREE.CylinderGeometry(0.38,0.38,0.32,14);
    const wheelPositions = [[-1.02,0.4,1.4],[1.02,0.4,1.4],[-1.02,0.4,-1.4],[1.02,0.4,-1.4]];
    const wheels = wheelPositions.map(p=>{
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.rotation.z = Math.PI/2;
      w.position.set(p[0],p[1],p[2]);
      w.castShadow = true;
      g.add(w);
      return w;
    });

    const tailL = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.15,0.05), new THREE.MeshStandardMaterial({color:0xff3b30, emissive:0xff2222, emissiveIntensity:0.6}));
    tailL.position.set(-0.75,0.6,2.12); g.add(tailL);
    const tailR = tailL.clone(); tailR.position.x = 0.75; g.add(tailR);

    g.userData.wheels = wheels;
    return g;
  }

  const playerCar = buildCarMesh(0xd63b2f);
  playerCar.position.set(6, 0, 10);
  scene.add(playerCar);

  const parkedColors = [0x3559c9, 0xd8d3c4, 0x2f8f5b];
  const parkedSpots = [[-6,-16,0.2],[10,-30,1.6],[-14,26,-0.4]];
  parkedSpots.forEach((p,i)=>{
    const car = buildCarMesh(parkedColors[i%parkedColors.length]);
    car.position.set(p[0],0,p[1]);
    car.rotation.y = p[2];
    scene.add(car);
  });

  // ---------- CHARACTER ----------
  function buildCharacterMesh(){
    const g = new THREE.Group();
    const skin = new THREE.MeshStandardMaterial({ color:0xe0ac80, roughness:0.8 });
    const shirt = new THREE.MeshStandardMaterial({ color:0x2c5f8a, roughness:0.7 });
    const pants = new THREE.MeshStandardMaterial({ color:0x2b2b33, roughness:0.8 });

    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.28,0.9,10), shirt);
    torso.position.y = 1.15; torso.castShadow = true;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.26,14,14), skin);
    head.position.y = 1.78; head.castShadow = true;
    const legs = new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.22,0.9,10), pants);
    legs.position.y = 0.5; legs.castShadow = true;
    const armGeo = new THREE.CylinderGeometry(0.09,0.09,0.75,8);
    const armL = new THREE.Mesh(armGeo, shirt); armL.position.set(-0.42,1.15,0); armL.castShadow = true;
    const armR = armL.clone(); armR.position.x = 0.42;

    g.add(torso, head, legs, armL, armR);
    return g;
  }
  const player = buildCharacterMesh();
  player.position.set(0, 0, 0);
  scene.add(player);

  // ---------- INPUT ----------
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if(e.code === 'KeyE') tryToggleEnter();
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  let dragging = false, lastX = 0, lastY = 0;
  const dom = renderer.domElement;
  dom.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener('mouseup', () => dragging = false);
  window.addEventListener('mousemove', e => {
    if(!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    camState.yaw -= dx * 0.0045;
    camState.pitch = Math.max(0.12, Math.min(1.15, camState.pitch - dy * 0.003));
    camState.manual = 2.5; // seconds of manual override before auto-follow resumes
  });
  dom.addEventListener('touchstart', e => { dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }, {passive:true});
  window.addEventListener('touchend', () => dragging = false);
  window.addEventListener('touchmove', e => {
    if(!dragging) return;
    const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    camState.yaw -= dx * 0.0045;
    camState.pitch = Math.max(0.12, Math.min(1.15, camState.pitch - dy * 0.003));
    camState.manual = 2.5;
  }, {passive:true});
  dom.addEventListener('wheel', e => {
    camState.dist = Math.max(4, Math.min(22, camState.dist + e.deltaY * 0.01));
  }, {passive:true});

  // ---------- STATE ----------
  const camState = { yaw: 0, pitch: 0.55, dist: 8.5, manual: 0 };
  let mode = 'walk'; // or 'drive'
  const player_ = { yaw: 0, vy: 0, grounded: true };
  const car_ = { yaw: 0, speed: 0 };
  car_.yaw = 0;

  const modeLabel = document.getElementById('modeLabel');
  const speedVal = document.getElementById('speedVal');
  const speedWrap = document.getElementById('speedWrap');
  const promptEl = document.getElementById('prompt');

  document.getElementById('hideHud').addEventListener('click', () => {
    document.getElementById('hud').style.display = 'none';
  });
  document.getElementById('crosshairFade').style.opacity = '0';
  setTimeout(()=>{ document.getElementById('crosshairFade').style.display='none'; }, 650);

  speedWrap.style.display = 'none';

  function distanceTo(a, b){
    return Math.hypot(a.x - b.x, a.z - b.z);
  }

  function tryToggleEnter(){
    if(mode === 'walk'){
      if(distanceTo(player.position, playerCar.position) < 3.2){
        mode = 'drive';
        car_.yaw = playerCar.rotation.y;
      }
    } else {
      mode = 'walk';
      const exitOffset = new THREE.Vector3(2.4, 0, 0).applyAxisAngle(new THREE.Vector3(0,1,0), car_.yaw);
      player.position.copy(playerCar.position).add(exitOffset);
      player.position.y = 0;
      player_.yaw = car_.yaw;
      car_.speed = 0;
    }
  }

  // ---------- COLLISION ----------
  const PAD = 0.4;
  function collides(x, z, radius){
    for(const b of buildings){
      if(x + radius > b.minX - PAD && x - radius < b.maxX + PAD &&
         z + radius > b.minZ - PAD && z - radius < b.maxZ + PAD){
        return true;
      }
    }
    return false;
  }
  function clampToCity(v){ return Math.max(-CITY_HALF, Math.min(CITY_HALF, v)); }

  // ---------- MAIN LOOP ----------
  const clock = new THREE.Clock();
  let wheelSpin = 0;

  function updateWalk(dt){
    const speed = keys['ShiftLeft'] || keys['ShiftRight'] ? 10.5 : 6;
    let ix = 0, iz = 0;
    if(keys['KeyW'] || keys['ArrowUp']) iz -= 1;
    if(keys['KeyS'] || keys['ArrowDown']) iz += 1;
    if(keys['KeyA'] || keys['ArrowLeft']) ix -= 1;
    if(keys['KeyD'] || keys['ArrowRight']) ix += 1;

    let moving = false;
    if(ix !== 0 || iz !== 0){
      moving = true;
      const len = Math.hypot(ix, iz);
      ix /= len; iz /= len;
      const forward = new THREE.Vector3(-Math.sin(camState.yaw), 0, -Math.cos(camState.yaw));
      const right = new THREE.Vector3(Math.cos(camState.yaw), 0, -Math.sin(camState.yaw));
      const move = new THREE.Vector3()
        .addScaledVector(forward, -iz)
        .addScaledVector(right, ix)
        .normalize()
        .multiplyScalar(speed * dt);

      const nx = player.position.x + move.x;
      const nz = player.position.z + move.z;
      if(!collides(nx, player.position.z, 0.4)) player.position.x = clampToCity(nx);
      if(!collides(player.position.x, nz, 0.4)) player.position.z = clampToCity(nz);

      const targetYaw = Math.atan2(move.x, move.z);
      let d = targetYaw - player_.yaw;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      player_.yaw += d * Math.min(1, dt * 10);
      player.rotation.y = player_.yaw;
    }

    // jump / gravity
    if(player_.grounded && keys['Space']){
      player_.vy = 6.2; player_.grounded = false;
    }
    player_.vy -= 18 * dt;
    player.position.y += player_.vy * dt;
    if(player.position.y <= 0){ player.position.y = 0; player_.vy = 0; player_.grounded = true; }

    if(!camState.manual) camState.yaw += (player_.yaw - camState.yaw) * Math.min(1, dt*1.6) * (moving?1:0);

    modeLabel.textContent = 'A pé';
    speedWrap.style.display = 'none';
    promptEl.style.display = (distanceTo(player.position, playerCar.position) < 3.2) ? 'block' : 'none';

    updateCamera(player.position, 1.35);
  }

  function updateDrive(dt){
    let accel = 0, steer = 0;
    if(keys['KeyW'] || keys['ArrowUp']) accel += 1;
    if(keys['KeyS'] || keys['ArrowDown']) accel -= 1;
    if(keys['KeyA'] || keys['ArrowLeft']) steer += 1;
    if(keys['KeyD'] || keys['ArrowRight']) steer -= 1;

    const maxFwd = 30, maxRev = -12;
    if(accel > 0) car_.speed += 16 * dt;
    else if(accel < 0) car_.speed -= 18 * dt;
    else {
      const decel = 10 * dt;
      if(car_.speed > 0) car_.speed = Math.max(0, car_.speed - decel);
      else car_.speed = Math.min(0, car_.speed + decel);
    }
    car_.speed = Math.max(maxRev, Math.min(maxFwd, car_.speed));

    if(Math.abs(car_.speed) > 0.3){
      const dir = car_.speed > 0 ? 1 : -1;
      car_.yaw += steer * 1.7 * dt * dir * Math.min(1, Math.abs(car_.speed)/8 + 0.35);
    }

    const forward = new THREE.Vector3(Math.sin(car_.yaw), 0, Math.cos(car_.yaw));
    const nx = playerCar.position.x + forward.x * car_.speed * dt;
    const nz = playerCar.position.z + forward.z * car_.speed * dt;

    if(!collides(nx, playerCar.position.z, 1.4)) playerCar.position.x = clampToCity(nx);
    else car_.speed *= 0.4;
    if(!collides(playerCar.position.x, nz, 1.4)) playerCar.position.z = clampToCity(nz);
    else car_.speed *= 0.4;

    playerCar.rotation.y = car_.yaw;
    wheelSpin += car_.speed * dt * 2;
    playerCar.userData.wheels.forEach(w => w.rotation.x = wheelSpin);

    if(!camState.manual) camState.yaw += (car_.yaw - camState.yaw) * Math.min(1, dt*2.2);

    modeLabel.textContent = 'Dirigindo';
    speedWrap.style.display = 'inline';
    speedVal.textContent = Math.round(Math.abs(car_.speed) * 3.6);
    promptEl.style.display = 'none';

    updateCamera(playerCar.position, 1.1);
  }

  function updateCamera(targetPos, heightOffset){
    const yaw = camState.yaw, pitch = camState.pitch, dist = camState.dist;
    const offset = new THREE.Vector3(
      Math.sin(yaw) * Math.cos(pitch) * dist,
      Math.sin(pitch) * dist + heightOffset,
      Math.cos(yaw) * Math.cos(pitch) * dist
    );
    const desired = new THREE.Vector3(targetPos.x, targetPos.y, targetPos.z).add(offset);
    camera.position.lerp(desired, 1);
    camera.lookAt(targetPos.x, targetPos.y + heightOffset + 0.3, targetPos.z);
  }

  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, clock.getDelta());
    if(camState.manual > 0) camState.manual = Math.max(0, camState.manual - dt);

    player.visible = (mode === 'walk');

    if(mode === 'walk') updateWalk(dt);
    else updateDrive(dt);

    const sunOffset = new THREE.Vector3(70,110,40);
    const focus = mode === 'walk' ? player.position : playerCar.position;
    sun.position.set(focus.x + sunOffset.x, sunOffset.y, focus.z + sunOffset.z);
    sun.target.position.set(focus.x, 0, focus.z);
    sun.target.updateMatrixWorld();

    renderer.render(scene, camera);
  }

  camState.yaw = Math.PI;
  animate();
})();
</script>
